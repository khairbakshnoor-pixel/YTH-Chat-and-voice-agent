<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Chat or talk with our AI assistant." />
    <title>YTH Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main aria-label="YTH Assistant"></main>

    <section class="assistant" aria-label="AI assistant">
      <div class="panel" id="assistant-panel" aria-labelledby="panel-title" hidden>
        <header class="panel-header">
          <div class="brand-mark" aria-hidden="true">
            <span>Y</span>
            <i></i>
          </div>
          <div class="brand-copy">
            <h1 id="panel-title">YTH Assistant</h1>
            <p><span class="online-dot"></span><span id="header-status">Online · Ready to help</span></p>
          </div>
          <button class="icon-button close-button" id="close-panel" type="button" aria-label="Close assistant">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18" /></svg>
          </button>
        </header>

        <div class="panel-content">
          <div class="welcome-view" id="welcome-view">
            <h2>Hey, we're here.</h2>
            <p class="intro">How would you like to connect?</p>
            <div class="choice-list" role="group" aria-label="Choose how to connect">
              <button class="choice-card voice-choice" type="button" data-action="talk">
                <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 3v11M8 7v6a4 4 0 0 0 8 0V7M5 12v1a7 7 0 0 0 14 0v-1M12 20v2m-4 0h8" /></svg></span>
                <span class="choice-copy"><strong>Talk now</strong><small>Start a live voice conversation</small></span>
                <svg class="choice-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
              <button class="choice-card chat-choice" type="button" data-action="chat">
                <span class="choice-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l1.6-3.2A7.5 7.5 0 1 1 20 11.5Z" /><path d="M8.5 11.5h7M8.5 14.5h4" /></svg></span>
                <span class="choice-copy"><strong>Chat agent</strong><small>Send a message to get started</small></span>
                <svg class="choice-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6" /></svg>
              </button>
            </div>
          </div>

          <section class="chat-view" id="chat-view" aria-label="Chat conversation" hidden>
            <button class="view-back" type="button" data-back><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" /></svg><span>Back</span></button>
            <div class="messages" id="messages" aria-live="polite" aria-relevant="additions">
              <div class="message assistant-message">
                <span class="message-avatar" aria-hidden="true">h</span>
                <p>Hey, thanks for reaching out to YTH. What can I help you with?</p>
              </div>
            </div>
            <form class="chat-form" id="chat-form">
              <label class="sr-only" for="message-input">Write a message</label>
              <input id="message-input" name="message" type="text" maxlength="1000" placeholder="Write a message..." autocomplete="off" required />
              <button class="send-button" type="submit" aria-label="Send message" title="Send message">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 3-7.2 18-3.6-7.2L3 10.2 21 3Z" /><path d="m10.2 13.8 4.2-4.2" /></svg>
              </button>
            </form>
            <p class="form-note" id="chat-status" role="status"></p>
          </section>

          <section class="voice-view" id="voice-view" aria-label="Voice conversation" hidden>
            <button class="view-back voice-back" type="button" data-back><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6M9 12h11" /></svg><span>Back</span></button>
            <div class="voice-orb" id="voice-orb" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 2v11M8 6v6a4 4 0 0 0 8 0V6M5 11v1a7 7 0 0 0 14 0v-1M12 19v3m-4 0h8" /></svg>
            </div>
            <h2 id="voice-title">Talk to our AI</h2>
            <p id="voice-status" role="status">A quick voice conversation, right here.</p>
            <button class="call-button" id="call-button" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.4 19.4 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 2 .7 2.9a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.2-1.3a2 2 0 0 1 2.1-.5c.9.3 1.9.6 2.9.7a2 2 0 0 1 1.8 2.1Z" /></svg>
              <span>Start talking</span>
            </button>
            <p class="form-note" id="voice-error" role="status"></p>
          </section>

          <div class="panel-footer">
            <span>Powered by AI</span>
            <span class="footer-spark" aria-hidden="true">✳</span>
          </div>
        </div>
      </div>

      <button class="launcher" id="assistant-launcher" type="button" aria-expanded="false" aria-controls="assistant-panel">
        <svg class="launcher-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M8 7v10M16 7v10M4 10v4M20 10v4" /></svg>
        <span>Talk to AI</span>
      </button>
    </section>

    <script type="module" src="app.js"></script>
  </body>
</html>
